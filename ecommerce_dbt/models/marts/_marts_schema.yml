version: 2

models:
  - name: fact_sales
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: store_id
        tests:
          - relationships:
              to: ref('dim_store')
              field: store_id
      - name: date_id
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_id